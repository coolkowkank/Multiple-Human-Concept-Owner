<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Updates</title>
<style>
:root{--ink:#1a1a2e;--mut:#5a6272;--hair:#e2dfd8}
*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#fcfbf9;color:var(--ink)}
main{max-width:900px;margin:0 auto}h1{font-size:24px;margin:0 0 4px}.mut{color:var(--mut)}
.card{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.t{font-weight:700}.row{font-size:14px;margin-top:4px}.when{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;background:#eef0f4;color:#333}
.failed{background:#fde2e2;color:#8a1c1c}.paused{background:#fff3d6;color:#7a5200}.ready{background:#dff3e3;color:#17612b}
</style><link rel="stylesheet" href="../nav.css"><script src="../nav.js"></script></head><body><main>
<h1>Updates</h1>
<p class="mut" id="asof"></p><p class="mut" id="note"></p>
<div id="list"></div>
<script>
var D=__DATA__;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.getElementById('asof').textContent='As of '+D.asOf.replace('T',' ')+' EET.';
document.getElementById('note').textContent=D.note;
function cls(s){return s==='failed'?'failed':s==='paused'?'paused':s.indexOf('ready')==0?'ready':''}
document.getElementById('list').innerHTML=D.items.slice().sort(function(a,b){return a.at<b.at?1:-1}).map(function(i){return '<div class="card"><div class="when">'+esc(i.at.replace('T',' '))+' EET</div><div class="t">'+esc(i.title)+'<span class="tag '+cls(i.status)+'">'+esc(i.status)+'</span></div><div class="row">'+esc(i.body)+'</div></div>'}).join('');
</script></main></body></html>
