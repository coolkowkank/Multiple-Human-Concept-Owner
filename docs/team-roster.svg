<text x="690" y="342" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >Model seat (free tier). PROVEN today: edits,</text>
<text x="690" y="359" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >commits and pushes via its own tool calls.</text>
<text x="690" y="379" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >Every commit author-labelled with the model name;</text>
<text x="690" y="396" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >transcripts are the evidence.</text>
<text x="690" y="416" font-size="11.5" fill="#8f857d" font-weight="400" text-anchor="start" >A model is not a GitHub account and never</text>
