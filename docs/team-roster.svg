<text x="690" y="520" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >Machine account, not a seat: links per-model</text>
<text x="690" y="537" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >author names into one contributor entry and</text>
<text x="690" y="554" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >authenticates model pushes (public_repo token;</text>
<text x="690" y="571" font-size="12" fill="#6a615c" font-weight="400" text-anchor="start" >models never see it).</text>
<text x="690" y="591" font-size="11.5" fill="#8f857d" font-weight="400" text-anchor="start" >Author, committer and pusher stay three</text>
<text x="690" y="608" font-size="11.5" fill="#8f857d" font-weight="400" text-anchor="start" >separate facts.</text>
